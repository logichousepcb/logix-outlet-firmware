; Logix Outlet: custom firmware for the Gosund WO1 in-wall duplex receptacle (ESP8285, 1 MB).
; Installed over Tasmota's web OTA form using the gzipped image, see README.md.

[env:logixoutlet]
platform = espressif8266 @ 4.2.1
board = esp8285
framework = arduino
board_build.flash_mode = dout
; 1 MB with a 64 KB LittleFS (settings, outlet state, energy totals). Tasmota's settings
; sector at 0xFB000 sits outside it and is read once on first boot to import WiFi/MQTT.
board_build.ldscript = eagle.flash.1m64.ld
board_build.filesystem = littlefs
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DNDEBUG
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.1
; Writes firmware.bin.gz next to firmware.bin: Tasmota only has ~384 KB free for an upload.
extra_scripts = post:scripts/gzip_firmware.py
monitor_speed = 115200
upload_speed = 115200
